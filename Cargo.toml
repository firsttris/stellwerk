[workspace]
resolver = "3"
members = ["crates/protocol", "crates/engine", "crates/agent", "crates/zentrale"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Tristan Teufel"]
repository = "https://github.com/firsttris/stellwerk"

[workspace.dependencies]
stellwerk-protocol = { path = "crates/protocol" }
stellwerk-engine = { path = "crates/engine" }
anyhow = "1"
flate2 = "1"
rand = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "net"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
