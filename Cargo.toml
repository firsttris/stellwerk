[workspace]
resolver = "3"
members = ["crates/protocol", "crates/engine", "crates/agent", "crates/zentrale"]

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
authors = ["Tristan Teufel"]
repository = "https://github.com/firsttris/stellwerk"

[workspace.dependencies]
stellwerk-protocol = { path = "crates/protocol" }
stellwerk-engine = { path = "crates/engine" }
stellwerk-agent = { path = "crates/agent" }
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
ed25519-dalek = "3"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mdns-sd = "0.21"
hostname = "0.4"
rand = "0.9"
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.13", features = ["json"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
