# Documentation as a website: https://speicherstadt.app/stellwerk/
# Source is docs/ (German only), built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Stellwerk
site_description: >-
  Dateien auf allen Rechnern im Betrieb aktuell halten, ohne Cloud und ohne Fileserver: eine
  zentrale Weboberfläche, die Syncthing auf all deinen Geräten verwaltet. Selbst gehostet, Open
  Source.
site_url: https://speicherstadt.app/stellwerk/
repo_url: https://github.com/Speicherstadt/stellwerk
repo_name: Speicherstadt/stellwerk
edit_uri: edit/main/docs/
copyright: >-
  Lizenz AGPL-3.0 · © Tristan Teufel und Contributors ·
  Stellwerk steht in keiner Verbindung zur Syncthing Foundation.<br>
  <a href="https://teufel-it.de/de/impressum/">Impressum</a> ·
  <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>

docs_dir: docs
# Pages as installation.html instead of installation/: this keeps the relative image paths
# working, which also have to work on GitHub
use_directory_urls: false

nav:
  - Start: index.md
  - Erste Schritte: getting-started.md
  - Bedienung: user-guide.md
  - Installation: installation.md
  - Gehostet oder über einen Partner: hosted.md
  - Referenz: reference.md
  - Sicherheit: security.md
  - Fehlersuche: troubleshooting.md
  - Architektur: architecture.md
  - Entwicklung: development.md

theme:
  name: material
  language: de
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable like in the app
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkle Darstellung
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Helle Darstellung
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  # Downloads fonts and scripts from third parties (Google Fonts, the Mermaid script) at build
  # time and serves them from the site, so a visit sends no data to anyone but GitHub Pages
  - privacy
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link zu diesem Abschnitt
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Speicherstadt/stellwerk
      name: Quellcode auf GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/tristanteu/stellwerk
      name: Image auf Docker Hub
