# Documentation as a website: https://firsttris.github.io/stellwerk/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Stellwerk
site_description: >-
  Central web UI to manage Syncthing on all your devices: pair devices, share folders and set
  paths from one place. Self-hosted, open source, no cloud.
site_url: https://firsttris.github.io/stellwerk/
repo_url: https://github.com/firsttris/stellwerk
repo_name: firsttris/stellwerk
edit_uri: edit/main/docs/
copyright: >-
  License AGPL-3.0 · © Tristan Teufel and contributors ·
  Stellwerk is not affiliated with the Syncthing Foundation.

docs_dir: docs
# Pages as installation.html instead of installation/: this keeps the relative image paths
# working, which also have to work on GitHub
use_directory_urls: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide: user-guide.md
  - Installation: installation.md
  - Reference: reference.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Development: development.md

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable like in the app
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/stellwerk
      name: Source code on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/tristanteu/stellwerk
      name: Image on Docker Hub
