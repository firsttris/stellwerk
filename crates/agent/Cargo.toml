[package]
name = "stellwerk-agent"
description = "Stellwerk agent: runs its own Syncthing on a device and keeps it at the state the Zentrale sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stellwerk-agent"
path = "src/main.rs"

# Without a console window on Windows, for the task at logon (src/service).
[[bin]]
name = "stellwerk-agent-background"
path = "src/bin/background.rs"

[dependencies]
stellwerk-engine.workspace = true
stellwerk-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hostname.workspace = true
mdns-sd.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
