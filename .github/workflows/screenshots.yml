name: Update screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      command: pnpm screenshots
      install: corepack enable && pnpm install --frozen-lockfile
      lockfile: pnpm-lock.yaml
      paths: docs/*.png
    permissions:
      contents: write
