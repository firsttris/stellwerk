name: Update screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      command: bun run screenshots
      # Bun of `packageManager` from npm (the Playwright image has no unzip and no jq)
      install: npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")" && bun install --frozen-lockfile
      lockfile: bun.lock
      paths: docs/*.png
    permissions:
      contents: write
