name: Agents

# The agent for every platform, as the artifact "agents" (binaries plus SHA256SUMS, and the
# install scripts the pairing command fetches, with this version filled in). release.yml
# attaches it to the GitHub release; run by hand it only builds.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries, cross-compiled with zig (aws-lc needs a musl C compiler)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: linux-aarch64, zig: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Pinned, so a new zig or cargo-zigbuild cannot break a release build; the versions of v0.1.1
      - if: matrix.zig
        run: pip install ziglang==0.17.0 && cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Build
        shell: bash
        run: |
          cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --release --locked \
            --target ${{ matrix.target }} -p stellwerk-agent --bins
          mkdir dist
          release=target/${{ matrix.target }}/release
          if [ "${{ matrix.ext }}" = .exe ]; then
            # Both programs under their own names: the service starts the windowless one
            7z a dist/stellwerk-agent-${{ matrix.name }}.zip \
              ./$release/stellwerk-agent.exe ./$release/stellwerk-agent-background.exe
          else
            cp $release/stellwerk-agent dist/stellwerk-agent-${{ matrix.name }}
          fi
      # The installer, then a silent install and uninstall on this runner
      - if: matrix.ext == '.exe'
        name: Windows installer
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          release=$(cygpath -w "$PWD/target/${{ matrix.target }}/release")
          makensis -V3 -DVERSION="$version" -DBIN="$release" -DLICENSE="$(cygpath -w "$PWD/LICENSE")" \
            -DOUT="$(cygpath -w "$PWD/dist/stellwerk-agent-setup-${{ matrix.name }}.exe")" \
            installer/windows/stellwerk-agent.nsi
      - if: matrix.ext == '.exe'
        name: Installer test
        shell: bash
        run: scripts/installer-smoke.sh "dist/stellwerk-agent-setup-${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  agents:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: agents
      - run: cd agents && sha256sum stellwerk-agent-* > SHA256SUMS && cat SHA256SUMS
      # The pairing dialog fetches them from releases/download/v<version>/
      - name: Install scripts
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for script in install.sh install.ps1; do
            sed "s/{{VERSION}}/$version/g" "installer/$script" > "agents/$script"
          done
          ! grep -l '{{VERSION}}' agents/install.*
      - uses: actions/upload-artifact@v4
        with:
          name: agents
          path: agents/*
          if-no-files-found: error
