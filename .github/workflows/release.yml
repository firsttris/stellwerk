name: Release

# A tag vX.Y.Z (from "Bump version" or pushed from a checkout) publishes the image
# tristanteu/stellwerk (also on GHCR) and the GitHub release with the agents attached.
# Run by hand on a branch it publishes the image as `edge` only.
#
# Fast because nothing runs twice: main's CI already tested the code (the release commit only
# raises the version, tested-on-main.yml), so the CI runs here only when it did not; the
# agents build beside the image from the start; and the image's build cache is shared with CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@ccr-161f105b-9ns022
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    # The CI's image check keeps the build cache in GHCR
    permissions:
      contents: read
      packages: write

  # Builds only, publishes nothing, so it need not wait for anything
  agents:
    uses: ./.github/workflows/agents.yml

  docker:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/stellwerk
      description: Central web UI to manage Syncthing on all your devices
      version-file: Cargo.toml
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # The agents, the Windows installer, the install scripts and SHA256SUMS on the release the
  # image job created
  attach:
    needs: [docker, agents]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.docker.result == 'success' && needs.agents.result == 'success' }}
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      version-file: Cargo.toml
      release-artifact: agents
    permissions:
      contents: write
