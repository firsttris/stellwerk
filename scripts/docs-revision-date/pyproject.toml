# Markdown extension for the docs (mkdocs.yml, markdown_extensions): the date of the last change
# under every page. Installed through requirements-docs.txt, so `zensical build` and
# `zensical serve` find it.
[project]
name = "stellwerk-docs-revision-date"
version = "0.1.0"
description = "Date of the last change from git under every page of the Stellwerk docs (Zensical)"
requires-python = ">=3.11"
dependencies = ["markdown"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["stellwerk_docs_revision_date.py"]
